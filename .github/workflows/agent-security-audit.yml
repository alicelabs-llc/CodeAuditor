name: AliceLabs agent security audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-security-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1'
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [universal-trust-adapter, atc-verifier, MARKETNOW]
    steps:
      - name: Checkout target (public repository)
        uses: actions/checkout@v4
        with:
          repository: alicelabs-llc/${{ matrix.target }}
          path: target
          persist-credentials: false
      - name: Install security scanners
        run: python -m pip install 'semgrep>=1,<2' 'pip-audit>=2,<3'
      # Full JSON report is kept (no --error): WARNING findings stay visible as
      # triage backlog in the artifact; the failure decision is the error_gate
      # step below. vectors/keys holds the AEP conformance TEST PKI, published
      # by design so third parties can reproduce the v1.3.0 vectors (attests
      # nothing outside the test vectors) — excluded with justification.
      - name: Run Semgrep static analysis
        id: semgrep
        continue-on-error: true
        run: |
          mkdir -p reports
          semgrep scan --config p/security-audit --config p/secrets --json \
            --exclude 'uta-monorepo/vectors/keys' \
            --output "reports/${{ matrix.target }}-semgrep.json" target
      - name: Gate on ERROR-severity findings
        id: error_gate
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          python3 - <<'PY'
          import json, os
          t = "${{ matrix.target }}"
          p = f"reports/{t}-semgrep.json"
          try:
              d = json.load(open(p))
          except Exception:
              print("SEMGRAP REPORT MISSING/INVALID — treating as ERROR")
              open(f"reports/{t}-error-gate.txt", "w").write("missing\n")
              raise SystemExit(1)
          res = d.get("results", [])
          errs = [r for r in res if r.get("extra", {}).get("severity") == "ERROR"]
          warns = len(res) - len(errs)
          print(f"{t}: {len(errs)} ERROR findings, {warns} WARNING findings")
          open(f"reports/{t}-error-gate.txt", "w").write(f"errors={len(errs)} warnings={warns}\n")
          for r in errs[:10]:
              print(f"  ERROR {r['check_id']} {r['path']}:{r['start']['line']}")
          raise SystemExit(1 if errs else 0)
          PY
      - name: Audit Python dependencies when present
        id: pip_audit
        continue-on-error: true
        shell: bash
        run: |
          if [ -f target/requirements.txt ]; then
            pip-audit -r target/requirements.txt --format json --output "reports/${{ matrix.target }}-pip-audit.json"
          else
            echo 'No root requirements.txt found; Python dependency audit skipped' > "reports/${{ matrix.target }}-pip-audit-skipped.txt"
          fi
      - name: Audit npm dependencies when present
        id: npm_audit
        continue-on-error: true
        shell: bash
        run: |
          if [ -f target/package-lock.json ]; then
            (cd target && npm audit --json) > "reports/${{ matrix.target }}-npm-audit.json"
          else
            echo 'No root package-lock.json found; npm dependency audit skipped' > "reports/${{ matrix.target }}-npm-audit-skipped.txt"
          fi
      - name: Capture target revision
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          if [ -d target/.git ]; then
            git -C target rev-parse HEAD > "reports/${{ matrix.target }}-target-sha.txt"
          else
            echo 'Target checkout unavailable' > "reports/${{ matrix.target }}-target-sha.txt"
          fi
      - name: Write evidence summary
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          {
            echo '# AliceLabs audit execution'
            echo "Repository: alicelabs-llc/${{ matrix.target }}"
            echo "Commit: ${{ github.sha }} (CodeAuditor workflow, not target commit)"
            echo "Semgrep gate: $(cat "reports/${{ matrix.target }}-error-gate.txt" 2>/dev/null || echo 'gate did not run')"
            echo "Python dependency audit outcome: ${{ steps.pip_audit.outcome }}"
            echo "npm dependency audit outcome: ${{ steps.npm_audit.outcome }}"
            echo 'A skipped audit or a scanner error is NOT a clean security result.'
            echo 'WARNING findings are triage backlog (non-blocking); ERROR findings fail the audit.'
          } > "reports/${{ matrix.target }}-summary.md"
          cat "reports/${{ matrix.target }}-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.target }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
      - name: Fail if ERROR-severity findings or scanner execution failed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.error_gate.outcome }}" != success ] || [ "${{ steps.pip_audit.outcome }}" != success ] || [ "${{ steps.npm_audit.outcome }}" != success ]; then
            echo 'ERROR-severity findings or scanner execution failure. Review uploaded evidence.'
            exit 1
          fi
